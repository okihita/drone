name: EngageMedia Automated Content Sync

on:
  # schedule:
  #   # Runs every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC)
  #   - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

jobs:
  sync-engagemedia-content:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger DRONE EngageMedia Sync Endpoint
        run: |
          echo "🚀 Triggering DRONE EngageMedia Ingestion Cron API..."
          APP_URL="${{ secrets.DRONE_APP_URL }}"
          if [ -z "$APP_URL" ]; then
            APP_URL="https://drone.okihita.com"
          fi
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$APP_URL/api/cron/engagemedia-sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          
          echo "Response Body: $BODY"
          echo "HTTP Status Code: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Sync API returned error status code: $HTTP_STATUS"
            exit 1
          fi
          
          echo "✅ EngageMedia content sync succeeded!"
